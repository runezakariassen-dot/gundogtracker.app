name: jakthund_app
description: "Offline-first hunting log for pointing dogs."
publish_to: 'none'

version: 1.0.12+18

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # Data processing
  csv: ^6.0.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  xml: ^6.5.0
  dio: ^5.7.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  package_info_plus: ^8.1.0
  share_plus: ^10.0.0
  device_info_plus: ^10.1.0
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Storage
  archive: ^3.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Media pickers
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  file_selector: 1.0.1
  video_player: ^2.6.1

  # GPS / Maps
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^10.0.0

  # UI / QR / Charts
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  fl_chart: ^0.68.0
  flutter_phoenix: ^1.0.0
  flutter_svg: ^1.1.6

  # Audio
  audioplayers: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8

  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  fake_async: ^1.3.0
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/stand_dog.png
    - assets/icons/
    - assets/sounds/
